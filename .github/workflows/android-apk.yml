name: Android installable APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'App.tsx'
      - '*.ts'
      - '*.tsx'
      - 'app.json'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install packages and verify JavaScript
        run: |
          npm ci
          npm run typecheck
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Assemble standalone preview APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Gokyuzunun-Sesi-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
